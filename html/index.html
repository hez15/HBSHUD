<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBSHUD</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ═══════════════════════════════════════════════════════
         Player Info Panel  (top-left)
         ═══════════════════════════════════════════════════════ -->
    <div id="player-panel" class="panel hidden">
        <div class="player-avatar">
            <!-- Person icon -->
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4
                         7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6
                         1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
            </svg>
        </div>
        <div class="player-details">
            <div id="player-name" class="player-name">Loading…</div>
            <div id="player-job"  class="player-job">Unemployed</div>
        </div>
        <div class="player-money">
            <div class="money-item">
                <span class="money-icon cash-icon">$</span>
                <span id="player-cash">0</span>
            </div>
            <div class="money-item">
                <span class="money-icon bank-icon">
                    <!-- Bank icon -->
                    <svg viewBox="0 0 24 24" fill="currentColor" width="11" height="11">
                        <path d="M4 10h3v7H4zm6.5 0h3v7h-3zM2 19h20v3H2zm15-9h3v7h-3zM12
                                 1L2 6v2h20V6z"/>
                    </svg>
                </span>
                <span id="player-bank">0</span>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════
         Location Panel  (bottom-left, above minimap)
         ═══════════════════════════════════════════════════════ -->
    <div id="location-panel" class="panel hidden">
        <div class="loc-icon">
            <!-- Map pin -->
            <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75
                         7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38
                         0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5
                         2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
        </div>
        <div class="loc-text">
            <div id="street-name"   class="street-name">Unknown Street</div>
            <div id="crossing-name" class="crossing-name hidden"></div>
            <div id="zone-name"     class="zone-name">Unknown Zone</div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════
         Status Circles  (bottom-right)  3 × 2 grid
         ═══════════════════════════════════════════════════════ -->
    <div id="status-panel">

        <!-- Health -->
        <div class="status-item" id="s-health">
            <div class="status-circle">
                <svg viewBox="0 0 42 42" class="progress-ring">
                    <circle class="ring-track" cx="21" cy="21" r="15.915"/>
                    <circle class="ring-fill" id="ring-health" cx="21" cy="21" r="15.915"
                            stroke-dasharray="100 0" stroke-dashoffset="25"/>
                </svg>
                <div class="status-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
                                 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5
                                 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22
                                 5.42 22 8.5c0 3.78-3.4 6.86-8.55
                                 11.54L12 21.35z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Armor -->
        <div class="status-item" id="s-armor">
            <div class="status-circle">
                <svg viewBox="0 0 42 42" class="progress-ring">
                    <circle class="ring-track" cx="21" cy="21" r="15.915"/>
                    <circle class="ring-fill" id="ring-armor" cx="21" cy="21" r="15.915"
                            stroke-dasharray="0 100" stroke-dashoffset="25"/>
                </svg>
                <div class="status-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12
                                 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Hunger -->
        <div class="status-item" id="s-hunger">
            <div class="status-circle">
                <svg viewBox="0 0 42 42" class="progress-ring">
                    <circle class="ring-track" cx="21" cy="21" r="15.915"/>
                    <circle class="ring-fill" id="ring-hunger" cx="21" cy="21" r="15.915"
                            stroke-dasharray="100 0" stroke-dashoffset="25"/>
                </svg>
                <div class="status-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66
                                 3.84 3.75 3.97V22h2.5v-9.03C11.34
                                 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76
                                 0-5 2.24-5 4z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Thirst -->
        <div class="status-item" id="s-thirst">
            <div class="status-circle">
                <svg viewBox="0 0 42 42" class="progress-ring">
                    <circle class="ring-track" cx="21" cy="21" r="15.915"/>
                    <circle class="ring-fill" id="ring-thirst" cx="21" cy="21" r="15.915"
                            stroke-dasharray="100 0" stroke-dashoffset="25"/>
                </svg>
                <div class="status-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2c-5.33 4.55-8 8.48-8 11.8
                                 0 4.98 3.8 8.2 8 8.2s8-3.22
                                 8-8.2c0-3.32-2.67-7.25-8-11.8z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Stress -->
        <div class="status-item" id="s-stress">
            <div class="status-circle">
                <svg viewBox="0 0 42 42" class="progress-ring">
                    <circle class="ring-track" cx="21" cy="21" r="15.915"/>
                    <circle class="ring-fill" id="ring-stress" cx="21" cy="21" r="15.915"
                            stroke-dasharray="0 100" stroke-dashoffset="25"/>
                </svg>
                <div class="status-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Oxygen  (hidden until underwater) -->
        <div class="status-item hidden" id="s-oxygen">
            <div class="status-circle">
                <svg viewBox="0 0 42 42" class="progress-ring">
                    <circle class="ring-track" cx="21" cy="21" r="15.915"/>
                    <circle class="ring-fill" id="ring-oxygen" cx="21" cy="21" r="15.915"
                            stroke-dasharray="100 0" stroke-dashoffset="25"/>
                </svg>
                <div class="status-icon">
                    <!-- Bubble / air icon -->
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10
                                 10 10-4.48 10-10S17.52 2 12 2zm1
                                 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                    </svg>
                </div>
            </div>
        </div>

    </div><!-- #status-panel -->

    <!-- ═══════════════════════════════════════════════════════
         Vehicle HUD  (bottom-centre, slides in when driving)
         ═══════════════════════════════════════════════════════ -->
    <div id="vehicle-panel" class="hidden">

        <div class="vehicle-speed">
            <span id="speed-value">0</span>
            <span id="speed-unit">MPH</span>
        </div>

        <div class="vehicle-divider"></div>

        <div class="vehicle-info">
            <!-- Fuel row -->
            <div class="vehicle-stat">
                <div class="v-label">FUEL</div>
                <div class="fuel-bar-wrap">
                    <div class="fuel-bar" id="fuel-bar"></div>
                </div>
                <span id="fuel-value">100</span>
            </div>

            <!-- Indicators row -->
            <div class="vehicle-indicators">
                <!-- Engine -->
                <div class="v-indicator" id="engine-indicator" title="Engine">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
                        <path d="M7 4v2H4v4h2v1H4v4h2v1H2V4h5zm14
                                 0v12h-4v-1h2v-4h-2v-1h2V6h-2V4h4zM9
                                 4h6v12H9V4z"/>
                    </svg>
                </div>
                <!-- Seatbelt -->
                <div class="v-indicator warning" id="seatbelt-indicator" title="Seatbelt (K)">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10
                                 10 10-4.48 10-10S17.52 2 12 2zm-2
                                 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19
                                 8l-9 9z"/>
                    </svg>
                </div>
            </div>
        </div>

        <div class="vehicle-divider"></div>

        <!-- Gear -->
        <div class="gear-display">
            <span class="gear-label">GEAR</span>
            <span id="gear-value">1</span>
        </div>

    </div><!-- #vehicle-panel -->

    <script src="js/app.js"></script>
</body>
</html>
