<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBSHUD</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ═══════════════════════════════════════════════════════
         Location Panel  (bottom-left, above minimap)
         ═══════════════════════════════════════════════════════ -->
    <div id="location-panel" class="panel hidden">
        <div class="loc-icon">
            <!-- Map pin -->
            <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75
                         7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38
                         0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5
                         2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
        </div>
        <div class="loc-text">
            <div id="street-name"   class="street-name">Unknown Street</div>
            <div id="crossing-name" class="crossing-name hidden"></div>
            <div id="zone-name"     class="zone-name">Unknown Zone</div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════
         Status Circles  (bottom-right)  3 × 2 grid
         ═══════════════════════════════════════════════════════ -->
    <div id="status-panel">

        <!-- Health -->
        <div class="status-item" id="s-health">
            <div class="status-circle">
                <svg viewBox="0 0 42 42" class="progress-ring">
                    <circle class="ring-track" cx="21" cy="21" r="15.915"/>
                    <circle class="ring-fill" id="ring-health" cx="21" cy="21" r="15.915"
                            stroke-dasharray="100 0" stroke-dashoffset="25"/>
                </svg>
                <div class="status-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
                                 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5
                                 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22
                                 5.42 22 8.5c0 3.78-3.4 6.86-8.55
                                 11.54L12 21.35z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Armor -->
        <div class="status-item" id="s-armor">
            <div class="status-circle">
                <svg viewBox="0 0 42 42" class="progress-ring">
                    <circle class="ring-track" cx="21" cy="21" r="15.915"/>
                    <circle class="ring-fill" id="ring-armor" cx="21" cy="21" r="15.915"
                            stroke-dasharray="0 100" stroke-dashoffset="25"/>
                </svg>
                <div class="status-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12
                                 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Hunger -->
        <div class="status-item" id="s-hunger">
            <div class="status-circle">
                <svg viewBox="0 0 42 42" class="progress-ring">
                    <circle class="ring-track" cx="21" cy="21" r="15.915"/>
                    <circle class="ring-fill" id="ring-hunger" cx="21" cy="21" r="15.915"
                            stroke-dasharray="100 0" stroke-dashoffset="25"/>
                </svg>
                <div class="status-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66
                                 3.84 3.75 3.97V22h2.5v-9.03C11.34
                                 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76
                                 0-5 2.24-5 4z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Thirst -->
        <div class="status-item" id="s-thirst">
            <div class="status-circle">
                <svg viewBox="0 0 42 42" class="progress-ring">
                    <circle class="ring-track" cx="21" cy="21" r="15.915"/>
                    <circle class="ring-fill" id="ring-thirst" cx="21" cy="21" r="15.915"
                            stroke-dasharray="100 0" stroke-dashoffset="25"/>
                </svg>
                <div class="status-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2c-5.33 4.55-8 8.48-8 11.8
                                 0 4.98 3.8 8.2 8 8.2s8-3.22
                                 8-8.2c0-3.32-2.67-7.25-8-11.8z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Stress -->
        <div class="status-item" id="s-stress">
            <div class="status-circle">
                <svg viewBox="0 0 42 42" class="progress-ring">
                    <circle class="ring-track" cx="21" cy="21" r="15.915"/>
                    <circle class="ring-fill" id="ring-stress" cx="21" cy="21" r="15.915"
                            stroke-dasharray="0 100" stroke-dashoffset="25"/>
                </svg>
                <div class="status-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Oxygen  (hidden until underwater) -->
        <div class="status-item hidden" id="s-oxygen">
            <div class="status-circle">
                <svg viewBox="0 0 42 42" class="progress-ring">
                    <circle class="ring-track" cx="21" cy="21" r="15.915"/>
                    <circle class="ring-fill" id="ring-oxygen" cx="21" cy="21" r="15.915"
                            stroke-dasharray="100 0" stroke-dashoffset="25"/>
                </svg>
                <div class="status-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10
                                 10 10-4.48 10-10S17.52 2 12 2zm1
                                 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                    </svg>
                </div>
            </div>
        </div>

    </div><!-- #status-panel -->

    <script src="js/app.js"></script>
</body>
</html>
